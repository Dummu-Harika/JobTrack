
{% extends "base.html" %}

{% block title %}My Profile | JobTrack{% endblock %}

{% block content %}
<div class="container">
    <h1>My Profile</h1>
    <p>Update your account information below.</p>

    <form method="POST" action="{{ url_for('profile') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ request.form.get('name', user.name) }}"
                maxlength="120"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ request.form.get('email', user.email) }}"
                maxlength="254"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('applications') }}" class="btn">
            Cancel
        </a>
    </form>

    <hr>

    <h2>Account Security</h2>
    <p>Keep your account secure by updating your password.</p>

    <a href="{{ url_for('change_password') }}" class="btn">
        Change Password
    </a>
</div>
{% endblock %}
